{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{% block title %}Nihongo Learning{% endblock %}</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;700&family=Source+Serif+4:ital,wght@0,400;0,600;1,400&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{% static 'dojo/css/style.css' %}">
</head>
<body>
<nav class="site-nav">
  <div class="wrap">
    <a href="{% url 'dojo:index' %}" class="brand">
      <span class="brand-jp">日本語</span>
      <span class="brand-en">Nihongo Learning</span>
    </a>
    <ul class="nav-links">
      <li><a href="{% url 'dojo:hiragana' %}" class="{% if request.resolver_match.url_name == 'hiragana' %}active{% endif %}">Hiragana</a></li>
      <li><a href="{% url 'dojo:katakana' %}" class="{% if request.resolver_match.url_name == 'katakana' %}active{% endif %}">Katakana</a></li>
      <li><a href="{% url 'dojo:vocabulary' %}" class="{% if request.resolver_match.url_name == 'vocabulary' %}active{% endif %}">Vocabulary</a></li>
      <li><a href="{% url 'dojo:quiz' %}" class="{% if request.resolver_match.url_name in 'quiz quiz_answer' %}active{% endif %}">Quiz</a></li>
    </ul>
  </div>
</nav>

<main class="wrap">
  {% block content %}{% endblock %}
</main>

<footer class="site-footer">
  <div class="wrap">Nihongo Learning — practice hiragana, katakana, and everyday vocabulary.</div>
</footer>
</body>
</html>
